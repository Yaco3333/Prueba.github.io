<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metabolic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<nav>
  <div class="logo">Metabolic<span>.</span></div>
</nav>

<section class="hero">
  <h1>Conocé tu <em>metabolismo</em></h1>
  <p>
    Calculá calorías y macronutrientes con Harris-Benedict.
  </p>
</section>

<div class="container">

  <div class="layout">

    <!-- FORM -->
    <div class="card">

      <h3>Datos</h3>

      <div class="field">
        <label>Edad</label>
        <input type="number" id="age" value="30">
      </div>

      <div class="field">
        <label>Peso (kg)</label>
        <input type="number" id="weight" value="75">
      </div>

      <div class="field">
        <label>Altura (cm)</label>
        <input type="number" id="height" value="175">
      </div>

      <div class="field">
        <label>Actividad</label>

        <select id="activity">
          <option value="1.2">Sedentario</option>
          <option value="1.55" selected>Moderado</option>
          <option value="1.9">Muy activo</option>
        </select>
      </div>

    </div>

    <!-- RESULTS -->
    <div class="results-card">

      <div class="big-number" id="target">
        2000
      </div>

      <div class="subtitle">
        kcal / día
      </div>

      <div class="stats">

        <div class="stat">
          <span>TMB</span>
          <strong id="tmb"></strong>
        </div>

        <div class="stat">
          <span>TDEE</span>
          <strong id="tdee"></strong>
        </div>

      </div>

      <div class="macro">

        <label>Proteínas</label>
        <div class="bar">
          <div id="pbar" class="fill protein"></div>
        </div>
        <span id="pgrams"></span>

      </div>

      <div class="macro">

        <label>Carbohidratos</label>
        <div class="bar">
          <div id="cbar" class="fill carb"></div>
        </div>
        <span id="cgrams"></span>

      </div>

      <div class="macro">

        <label>Grasas</label>
        <div class="bar">
          <div id="fbar" class="fill fat"></div>
        </div>
        <span id="fgrams"></span>

      </div>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
